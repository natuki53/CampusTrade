<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マイページ | CampusTrade</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <div th:replace="~{fragments/header :: header('mypage')}"></div>

  <main class="page">
    <div class="page-title-row">
      <div>
        <p class="eyebrow">My Page</p>
        <h1>マイページ</h1>
      </div>
      <a class="primary-link" th:href="@{/products/new}">出品する</a>
    </div>

    <section class="dashboard-grid">
      <a class="dashboard-card" th:href="@{/mypage/purchases}">
        <span>購入者ページ</span>
        <strong th:text="${purchaseCount}">0</strong>
        <p>購入した商品と取引状況を確認します。</p>
      </a>
      <a class="dashboard-card" th:href="@{/mypage/sales}">
        <span>出品者ページ</span>
        <strong th:text="${saleCount}">0</strong>
        <p>出品中の商品と成立した取引を確認します。</p>
      </a>
      <div class="dashboard-card">
        <span>進行中取引</span>
        <strong th:text="${activeTradeCount}">0</strong>
        <p>取引中の商品数です。</p>
      </div>
    </section>
  </main>
</body>
</html>
