<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理者商品一覧 | CampusTrade</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <div th:replace="~{fragments/header :: header('admin')}"></div>

  <main class="page">
    <div class="page-title-row">
      <div>
        <p class="eyebrow">Admin</p>
        <h1>商品管理</h1>
      </div>
      <a class="secondary-button" th:href="@{/admin/categories}">カテゴリ管理</a>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>商品</th>
            <th>出品者</th>
            <th>カテゴリ</th>
            <th>取引</th>
            <th>表示</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="product : ${products}">
            <td th:text="${product.id}">1</td>
            <td><a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">商品名</a></td>
            <td th:text="${product.seller.nickname}">出品者</td>
            <td th:text="${product.category.name}">カテゴリ</td>
            <td th:text="${product.tradeStatus}">OPEN</td>
            <td th:text="${product.moderationStatus}">ACTIVE</td>
            <td>
              <form th:if="${product.moderationStatus == T(com.example.campustrade.domain.ModerationStatus).ACTIVE}"
                  th:action="@{/admin/products/{id}/prohibit(id=${product.id})}" method="post">
                <button class="danger-button" type="submit">禁止</button>
              </form>
              <form th:if="${product.moderationStatus == T(com.example.campustrade.domain.ModerationStatus).PROHIBITED}"
                  th:action="@{/admin/products/{id}/activate(id=${product.id})}" method="post">
                <button class="primary-button" type="submit">解除</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <p class="empty-state" th:if="${products.isEmpty()}">商品はありません。</p>
  </main>
</body>
</html>
