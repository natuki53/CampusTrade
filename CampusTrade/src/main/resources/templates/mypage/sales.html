<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出品者ページ | CampusTrade</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <div th:replace="~{fragments/header :: header('mypage')}"></div>

  <main class="page">
    <div class="page-title-row">
      <div>
        <p class="eyebrow">Sales</p>
        <h1>出品者ページ</h1>
      </div>
      <a class="primary-link" th:href="@{/products/new}">出品する</a>
    </div>

    <div class="list-stack" th:if="${!products.isEmpty()}">
      <article class="list-item" th:each="product : ${products}">
        <div>
          <p class="eyebrow" th:text="${product.category.name}">カテゴリ</p>
          <h2 th:text="${product.name}">商品名</h2>
          <p>
            <span th:text="${product.tradeStatus == T(com.example.campustrade.domain.TradeStatus).OPEN ? '出品中' : product.tradeStatus == T(com.example.campustrade.domain.TradeStatus).LOCKED ? '取引中' : '取引完了'}">出品中</span>
            <span th:if="${product.buyer != null}"> / 購入者: </span>
            <span th:if="${product.buyer != null}" th:text="${product.buyer.nickname}">購入者</span>
          </p>
        </div>
        <a class="secondary-button" th:if="${product.tradeStatus == T(com.example.campustrade.domain.TradeStatus).OPEN}"
            th:href="@{/products/{id}(id=${product.id})}">商品詳細</a>
        <a class="primary-link" th:if="${product.tradeStatus != T(com.example.campustrade.domain.TradeStatus).OPEN}"
            th:href="@{/mypage/sales/{id}(id=${product.id})}">取引詳細</a>
      </article>
    </div>
    <p class="empty-state" th:if="${products.isEmpty()}">出品した商品はありません。</p>
  </main>
</body>
</html>
