<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusTrade</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <div th:replace="~{fragments/header :: header('search')}"></div>

  <main class="page">
    <section class="search-stage">
      <div class="search-copy">
        <p class="eyebrow">学内受け渡し</p>
        <h1>必要なものを、近くの学生から探す</h1>
        <p class="lead">教科書、文房具、電化製品、生活用品を出品中の商品から確認できます。</p>
      </div>
      <form class="search-box" th:action="@{/products}" method="get" th:object="${searchForm}">
        <label for="home-search">キーワード検索</label>
        <div class="search-row">
          <input id="home-search" type="search" th:field="*{keyword}" placeholder="商品名や説明で検索">
          <button class="primary-button" type="submit">検索</button>
        </div>
        <div class="quick-chips" aria-label="カテゴリ">
          <a th:each="category : ${rootCategories}" th:href="@{/products(categoryId=${category.id})}" th:text="${category.name}">カテゴリ</a>
        </div>
      </form>
    </section>

    <section class="home-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">新着</p>
          <h2>新着商品</h2>
        </div>
        <a class="text-button" th:href="@{/products}">すべて見る</a>
      </div>
      <div class="product-grid" th:if="${!products.isEmpty()}">
        <article class="product-card" th:each="product : ${products}">
          <a th:href="@{/products/{id}(id=${product.id})}">
            <div class="product-thumb">CT</div>
            <div class="product-info">
              <p class="price" th:text="|¥${#numbers.formatInteger(product.price, 0, 'COMMA')}|">¥1,200</p>
              <h3 th:text="${product.name}">商品名</h3>
              <p>
                <span th:text="${product.category.name}">カテゴリ</span>
                <span> · </span>
                <span th:text="${product.conditionLabel}">状態</span>
              </p>
            </div>
          </a>
        </article>
      </div>
      <p class="empty-state" th:if="${products.isEmpty()}">現在表示できる新着商品はありません。</p>
    </section>
  </main>
</body>
</html>
