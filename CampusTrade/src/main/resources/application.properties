spring.application.name=CampusTrade
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campustrade?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:campustrade}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:campustrade}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
server.error.whitelabel.enabled=false
