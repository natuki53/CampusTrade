<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${mode == 'edit' ? '商品編集 | CampusTrade' : '商品出品 | CampusTrade'}">商品出品 | CampusTrade</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/js/product-form.js}" defer></script>
</head>
<body>
  <div th:replace="~{fragments/header :: header('sell')}"></div>

  <main class="page editor-page">
    <div class="page-title-row">
      <div>
        <p class="eyebrow" th:text="${mode == 'edit' ? 'Edit' : 'Sell'}">Sell</p>
        <h1 th:text="${mode == 'edit' ? '商品編集' : '商品出品'}">商品出品</h1>
      </div>
      <a class="secondary-button" th:href="${mode == 'edit'} ? @{/products/{id}(id=${product.id})} : @{/products}">戻る</a>
    </div>

    <form class="editor-form" th:action="${mode == 'edit'} ? @{/products/{id}/edit(id=${product.id})} : @{/products}"
        th:object="${productForm}" method="post" enctype="multipart/form-data">
      <label>
        <span class="field-label">商品名 <span class="required-badge">必須</span></span>
        <input type="text" th:field="*{name}" required>
        <small class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
      </label>
      <label>
        <span class="field-label">説明 <span class="required-badge">必須</span></span>
        <textarea th:field="*{description}" rows="7" required></textarea>
        <small class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small>
      </label>
      <div class="form-grid">
        <label>
          <span class="field-label">価格 <span class="required-badge">必須</span></span>
          <input type="number" th:field="*{price}" min="0" required>
          <small class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></small>
        </label>
        <label>
          <span class="field-label">カテゴリ <span class="required-badge">必須</span></span>
          <select th:field="*{categoryId}" required>
            <option value="">選択してください</option>
            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">カテゴリ</option>
          </select>
          <small class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></small>
        </label>
      </div>
      <label>
        <span class="field-label">商品状態 <span class="required-badge">必須</span></span>
        <input type="text" th:field="*{conditionLabel}" placeholder="例: 書き込み少なめ、動作確認済み" required>
        <small class="field-error" th:if="${#fields.hasErrors('conditionLabel')}" th:errors="*{conditionLabel}"></small>
      </label>
      <div class="image-upload-field">
        <span class="field-label">
          <span th:text="${mode == 'edit' ? '商品画像（追加・削除できます）' : '商品画像'}">商品画像</span>
          <span class="required-badge" th:if="${mode == 'new'}">必須</span>
          <span class="optional-badge" th:if="${mode == 'edit'}">追加は任意</span>
        </span>
        <div class="existing-image-panel" th:if="${mode == 'edit' and existingImages != null and !existingImages.isEmpty()}">
          <div class="existing-image-head">
            <span>現在の画像</span>
            <small>削除ボタンを押すと確認後に画像を削除します。新しい画像は現在の画像に追加されます。</small>
          </div>
          <ul class="existing-image-list">
            <li th:each="image, stat : ${existingImages}"
                th:data-image-id="${image.id}"
                th:data-delete-url="@{/products/{productId}/images/{imageId}/delete(productId=${product.id}, imageId=${image.id})}"
                th:data-delete-message="|この画像を削除しますか？|"
                data-existing-image-item>
              <img th:src="@{/products/{productId}/images/{imageId}(productId=${product.id}, imageId=${image.id})}"
                  th:alt="|${product.name} 現在の画像${stat.count}|">
              <button class="existing-image-delete-button" type="button" data-existing-image-delete>削除</button>
            </li>
          </ul>
        </div>
        <label class="image-picker" for="images">
          <span class="image-picker-action">画像を追加</span>
          <span class="image-picker-status" data-image-upload-status>0/5枚</span>
        </label>
        <input class="image-input" type="file" th:field="*{images}" accept="image/jpeg,image/png,image/webp"
            multiple th:required="${mode == 'new'}" data-image-upload-input data-max-files="5">
        <ul class="selected-file-list" data-image-upload-list aria-live="polite"></ul>
        <small class="help-text" th:text="${mode == 'new' ? '1枚以上必須です。最大5枚、1枚5MBまで。JPEG、PNG、WebPに対応しています。' : '最大5枚、1枚5MBまで。JPEG、PNG、WebPに対応しています。'}">1枚以上必須です。最大5枚、1枚5MBまで。JPEG、PNG、WebPに対応しています。</small>
        <small class="field-error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></small>
      </div>
      <button class="primary-button" type="submit" th:text="${mode == 'edit' ? '更新する' : '出品する'}">出品する</button>
    </form>
  </main>
</body>
</html>
