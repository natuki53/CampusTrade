<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品検索 | CampusTrade</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <div th:replace="~{fragments/header :: header('search')}"></div>

  <main class="page">
    <div class="page-title-row">
      <div>
        <p class="eyebrow">Search</p>
        <h1>商品検索</h1>
      </div>
      <a class="primary-link" th:href="@{/products/new}">出品する</a>
    </div>

    <form class="filter-bar" th:action="@{/products}" method="get" th:object="${searchForm}">
      <label>
        <span>キーワード</span>
        <input type="search" th:field="*{keyword}" placeholder="商品名・説明">
      </label>
      <label>
        <span>カテゴリ</span>
        <select th:field="*{categoryId}">
          <option value="">すべて</option>
          <option th:each="category : ${categories}" th:value="${category.id}"
              th:text="${category.parent == null ? category.name : '　' + category.name}">
            カテゴリ
          </option>
        </select>
      </label>
      <button class="primary-button" type="submit">検索</button>
    </form>

    <div class="product-grid" th:if="${!products.isEmpty()}">
      <article class="product-card" th:each="product : ${products}">
        <a th:href="@{/products/{id}(id=${product.id})}">
          <div class="product-thumb">CT</div>
          <div class="product-info">
            <p class="price" th:text="|¥${#numbers.formatInteger(product.price, 0, 'COMMA')}|">¥1,200</p>
            <h3 th:text="${product.name}">商品名</h3>
            <p>
              <span th:text="${product.category.name}">カテゴリ</span>
              <span> · </span>
              <span th:text="${product.conditionLabel}">状態</span>
            </p>
            <p th:text="${#temporals.format(product.createdAt, 'yyyy/MM/dd HH:mm')}">2026/07/06 10:00</p>
          </div>
        </a>
      </article>
    </div>
    <p class="empty-state" th:if="${products.isEmpty()}">条件に一致する商品はありません。</p>
  </main>
</body>
</html>
