<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
  <th:block th:fragment="header(active)">
  <header class="app-header">
    <button class="menu-button" type="button" aria-label="メニューを開く" aria-controls="site-menu"
        aria-expanded="false" data-menu-open>
      <span class="menu-icon" aria-hidden="true"></span>
    </button>
    <a class="brand" th:href="@{/}" aria-label="CampusTrade トップ">
      <span class="brand-mark">CT</span>
      <span>
        <strong>CampusTrade</strong>
        <small>学内リユース</small>
      </span>
    </a>
    <nav class="primary-nav" aria-label="主要ナビゲーション">
      <a class="nav-link" th:classappend="${active == 'search'} ? 'is-active'" th:href="@{/}">
        <span>探す</span>
      </a>
      <a class="nav-link" th:classappend="${active == 'sell'} ? 'is-active'" th:href="@{/products/new}">
        <span>出品</span>
      </a>
      <a class="nav-link" th:classappend="${active == 'mypage'} ? 'is-active'" th:href="@{/mypage}">
        <span>マイページ</span>
      </a>
      <a class="nav-link" th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}"
          th:classappend="${active == 'admin'} ? 'is-active'" th:href="@{/admin/products}">
        <span>管理</span>
      </a>
    </nav>
    <div class="header-actions">
      <span class="user-name" th:if="${currentUser != null}" th:text="${currentUser.nickname}">ユーザー</span>
      <form th:if="${currentUser != null}" th:action="@{/logout}" method="post">
        <button class="secondary-button" type="submit">ログアウト</button>
      </form>
      <a class="login-pill" th:if="${currentUser == null}" th:href="@{/login}">ログイン</a>
    </div>
  </header>

  <div class="drawer-backdrop" data-menu-backdrop hidden></div>
  <aside class="side-drawer" id="site-menu" aria-label="メニュー" aria-hidden="true" data-menu-drawer>
    <div class="drawer-head">
      <button class="icon-button" type="button" aria-label="メニューを閉じる" data-menu-close>
        <span class="close-icon" aria-hidden="true"></span>
      </button>
      <a class="brand drawer-brand" th:href="@{/}" aria-label="CampusTrade トップ">
        <span class="brand-mark">CT</span>
        <span>
          <strong>CampusTrade</strong>
          <small>学内リユース</small>
        </span>
      </a>
    </div>

    <nav class="drawer-nav" aria-label="サイドメニュー">
      <a class="drawer-link" th:classappend="${active == 'search'} ? 'is-active'" th:href="@{/}">
        <span>探す</span>
      </a>
      <a class="drawer-link" th:classappend="${active == 'sell'} ? 'is-active'" th:href="@{/products/new}">
        <span>出品する</span>
      </a>
      <a class="drawer-link" th:classappend="${active == 'mypage'} ? 'is-active'" th:href="@{/mypage}">
        <span>マイページ</span>
      </a>
      <a class="drawer-link" th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}"
          th:classappend="${active == 'admin'} ? 'is-active'" th:href="@{/admin/products}">
        <span>管理者メニュー</span>
      </a>
    </nav>

    <div class="drawer-section theme-section" aria-label="テーマ設定">
      <p class="drawer-label">テーマ</p>
      <div class="theme-options">
        <button class="theme-option is-active" type="button" data-theme-option="aqua" aria-pressed="true">
          <span class="theme-swatch theme-swatch-aqua" aria-hidden="true"></span>
          <span>水色</span>
        </button>
        <button class="theme-option" type="button" data-theme-option="pink" aria-pressed="false">
          <span class="theme-swatch theme-swatch-pink" aria-hidden="true"></span>
          <span>ピンク</span>
        </button>
        <button class="theme-option" type="button" data-theme-option="purple" aria-pressed="false">
          <span class="theme-swatch theme-swatch-purple" aria-hidden="true"></span>
          <span>紫</span>
        </button>
        <button class="theme-option" type="button" data-theme-option="lime" aria-pressed="false">
          <span class="theme-swatch theme-swatch-lime" aria-hidden="true"></span>
          <span>黄緑</span>
        </button>
      </div>
    </div>

    <div class="drawer-section" aria-label="アカウント">
      <p class="drawer-label">アカウント</p>
      <p class="drawer-user-name" th:if="${currentUser != null}" th:text="${currentUser.nickname}">ユーザー</p>
      <form class="drawer-action-form" th:if="${currentUser != null}" th:action="@{/logout}" method="post">
        <button class="drawer-action" type="submit">ログアウト</button>
      </form>
      <a class="drawer-action" th:if="${currentUser == null}" th:href="@{/login}">ログイン</a>
    </div>
  </aside>
  <script th:src="@{/js/header-menu.js}" defer></script>
  </th:block>
</body>
</html>
