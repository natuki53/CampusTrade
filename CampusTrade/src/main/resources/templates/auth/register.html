<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会員登録 | CampusTrade</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <main class="auth-page">
    <section class="auth-panel">
      <a class="brand" th:href="@{/}">
        <span class="brand-mark">CT</span>
        <span>
          <strong>CampusTrade</strong>
          <small>学内リユース</small>
        </span>
      </a>
      <h1>会員登録</h1>
      <form class="form-stack" th:action="@{/register}" th:object="${registerForm}" method="post">
        <label>
          <span>学生番号</span>
          <input type="text" th:field="*{studentNumber}" autocomplete="username" required autofocus>
          <small class="field-error" th:if="${#fields.hasErrors('studentNumber')}" th:errors="*{studentNumber}"></small>
        </label>
        <label>
          <span>パスワード</span>
          <input type="password" th:field="*{password}" autocomplete="new-password" required>
          <small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
        </label>
        <label>
          <span>ニックネーム</span>
          <input type="text" th:field="*{nickname}" required>
          <small class="field-error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></small>
        </label>
        <button class="primary-button" type="submit">登録する</button>
      </form>
      <p class="switch-link">登録済みの場合は <a th:href="@{/login}">ログイン</a></p>
    </section>
  </main>
</body>
</html>
