<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | CampusTrade</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <main class="auth-page">
    <section class="auth-panel">
      <a class="brand" th:href="@{/}">
        <span class="brand-mark">CT</span>
        <span>
          <strong>CampusTrade</strong>
          <small>学内リユース</small>
        </span>
      </a>
      <h1>ログイン</h1>
      <p class="alert success" th:if="${param.registered}">会員登録が完了しました。ログインしてください。</p>
      <p class="alert success" th:if="${param.logout}">ログアウトしました。</p>
      <p class="alert danger" th:if="${param.error}">学生番号またはパスワードが正しくありません。</p>
      <form class="form-stack" th:action="@{/login}" method="post">
        <label>
          <span>学生番号</span>
          <input type="text" name="studentNumber" autocomplete="username" required autofocus>
        </label>
        <label>
          <span>パスワード</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="primary-button" type="submit">ログイン</button>
      </form>
      <p class="switch-link">アカウントがない場合は <a th:href="@{/register}">会員登録</a></p>
    </section>
  </main>
</body>
</html>
