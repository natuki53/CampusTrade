<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>購入者ページ | CampusTrade</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <div th:replace="~{fragments/header :: header('mypage')}"></div>

  <main class="page">
    <div class="page-title-row">
      <div>
        <p class="eyebrow">Purchases</p>
        <h1>購入者ページ</h1>
      </div>
      <a class="secondary-button" th:href="@{/mypage}">マイページへ</a>
    </div>

    <div class="list-stack" th:if="${!products.isEmpty()}">
      <article class="list-item" th:each="product : ${products}">
        <div>
          <p class="eyebrow" th:text="${product.category.name}">カテゴリ</p>
          <h2 th:text="${product.name}">商品名</h2>
          <p>
            <span>出品者: </span><span th:text="${product.seller.nickname}">出品者</span>
            <span> / </span>
            <span th:text="${product.tradeStatus == T(com.example.campustrade.domain.TradeStatus).LOCKED ? '取引中' : '取引完了'}">取引中</span>
          </p>
        </div>
        <a class="primary-link" th:href="@{/mypage/purchases/{id}(id=${product.id})}">詳細</a>
      </article>
    </div>
    <p class="empty-state" th:if="${products.isEmpty()}">購入した商品はありません。</p>
  </main>
</body>
</html>
